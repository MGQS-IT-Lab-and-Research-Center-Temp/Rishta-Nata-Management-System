name: "C# .NET Code Scan"

on:
  push:
    branches: [ "**" ] # Triggers on EVERY branch push
  pull_request:
    branches: [ "master", "dev" ] # Standard practice: also scan PRs targeting main
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze C# Code
    # Use windows-latest if you are on legacy .NET Framework. 
    # Use ubuntu-latest for modern .NET (Core, 5, 6, 7, 8, 9)
    runs-on: ubuntu-latest 
    
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Optional: If your app requires a specific .NET version, install it here
    # - name: Setup .NET
    #   uses: actions/setup-dotnet@v4
    #   with:
    #     dotnet-version: '8.0.x'

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}

    # Autobuild attempts to build any compiled languages (C# in this case)
    - name: Autobuild
      uses: github/codeql-action/autobuild@v3
      
    # NOTE: If Autobuild fails for complex .NET solutions, comment it out and use:
    # - name: Build .NET
    #   run: dotnet build --configuration Release

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
